name: Claude PR review

on:
  workflow_call:
    inputs:
      extra_prompt:
        description: Repo-specific review instructions appended to the base prompt
        type: string
        default: ""
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true

jobs:
  review:
    # Only a "/review" comment on a PR, from someone with write access (comments cost API credits).
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/review') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ github.event.issue.number }}/head
          fetch-depth: 1

      # The review method lives in this repo; a reusable workflow can't see its own files otherwise.
      - uses: actions/checkout@v4
        with:
          repository: luctst/claude-review
          ref: main
          path: .claude-review
          sparse-checkout: prompts

      # Pass 1: general review by a fresh agent. Writes its findings to a file, posts nothing.
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.issue.number }}

            You are reviewing this pull request with no prior context. Read the diff
            (`gh pr diff <PR NUMBER>`) and any files you need to understand it.
            Ignore the `.claude-review/` folder: it is not part of the PR.

            Focus on correctness bugs, security issues, and breaking changes.
            Skip style nits a linter would catch.

            Don't post anything on the PR. Write your findings to `.claude-review/general.md`,
            one per finding, each with `path:line` (a line of the new file), whether it is
            blocking, and a short explanation. Nothing found: write `No findings.`

            ${{ inputs.extra_prompt }}
          claude_args: |
            --allowedTools "Write,Bash(gh pr diff:*),Bash(gh pr view:*),Read,Grep,Glob"

      # Pass 2: another fresh agent runs the ponytail review, then posts ONE review for both passes.
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.issue.number }}

            You are reviewing this pull request with no prior context.

            First read these two files, which are not part of the PR:
              - `.claude-review/prompts/ponytail-review.md`: your review method and report format. Follow it.
              - `.claude-review/prompts/ponytail.md`: the "lazy senior dev" standard. Use it to judge
                whether the PR is over-engineered. Its rules for writing code and its reply ending don't apply.
            Ignore the `.claude-review/` folder in every other way.

            The change to review is this PR: `gh pr diff <PR NUMBER>`.

            Another reviewer already reviewed this PR: their findings are in `.claude-review/general.md`.
            Don't repeat them in your own findings.

            Then post a single review that holds both their findings and yours. Write it to
            `.claude-review/review.json`:
              {"event": "...", "body": "...", "comments": [{"path": "...", "line": N, "side": "RIGHT", "body": "..."}]}
            - `event`: `REQUEST_CHANGES` if the other reviewer found a blocking issue or you have a
              "Must fix" finding. Otherwise `APPROVE`, even with non-blocking notes.
            - `comments`: one per finding that points at specific lines. `line` must be a line
              of the new file that is inside the diff.
            - `body`: your report, with the other reviewer's findings listed first under
              `General review:`. Don't repeat in the body what an inline comment already says;
              refer to it by its number.
            Submit it with exactly:
              `gh api --method POST repos/${{ github.repository }}/pulls/${{ github.event.issue.number }}/reviews --input .claude-review/review.json`
            If GitHub rejects the request, nothing was posted: fix `review.json` (move a finding
            whose line it rejects into `body`) and submit again. Once a submit succeeds, stop.

            ${{ inputs.extra_prompt }}
          claude_args: |
            --allowedTools "Write,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh api --method POST repos/${{ github.repository }}/pulls/${{ github.event.issue.number }}/reviews --input .claude-review/review.json),Read,Grep,Glob"
